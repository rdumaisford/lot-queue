<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lot Transfer Queue</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f4; --surface: #ffffff; --border: #e2e2df; --border-strong: #c8c8c4;
    --text: #1a1a18; --text-muted: #6b6b67; --text-faint: #9c9c98;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --radius: 10px; --radius-sm: 6px;
  }
  body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5; min-height: 100vh; }

  .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; align-items: center; justify-content: space-between; height: 56px; position: sticky; top: 0; z-index: 10; }
  .header-brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .header-icon { width: 28px; height: 28px; background: var(--text); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .header-icon svg { width: 16px; height: 16px; fill: none; stroke: white; stroke-width: 1.8; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-time { font-size: 13px; color: var(--text-muted); }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; transition: background 0.3s; }
  .sync-dot.live { background: #22c55e; } .sync-dot.error { background: #ef4444; }

  .tabs { display: flex; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; overflow-x: auto; }
  .tab { padding: 12px 18px; font-size: 14px; font-weight: 500; border: none; background: none; cursor: pointer; color: var(--text-muted); border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; align-items: center; gap: 6px; transition: color 0.15s; white-space: nowrap; }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tab-count { background: var(--bg); border-radius: 20px; padding: 1px 7px; font-size: 11px; font-weight: 600; color: var(--text-muted); min-width: 20px; text-align: center; }
  .tab.active .tab-count { background: var(--text); color: white; }

  .main { padding: 24px; max-width: 960px; margin: 0 auto; }
  .panel { display: none; } .panel.active { display: block; }

  /* Form */
  .form-wrap { max-width: 500px; }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
  .form-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .form-subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
  .form-row { margin-bottom: 16px; }
  .form-row label { display: block; font-size: 13px; font-weight: 500; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.04em; }
  .form-row input, .form-row select, .form-row textarea { width: 100%; padding: 10px 12px; font-size: 14px; font-family: var(--font); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none; transition: border-color 0.15s; }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--text); background: white; }
  .form-row textarea { resize: vertical; min-height: 72px; }

  /* Booking type toggle */
  .booking-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 20px; }
  .toggle-btn { padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); cursor: pointer; text-align: center; transition: all 0.15s; }
  .toggle-btn.active { background: var(--text); color: white; border-color: var(--text); }
  .toggle-btn-label { font-size: 14px; font-weight: 600; display: block; }
  .toggle-btn-sub { font-size: 12px; opacity: 0.6; display: block; margin-top: 2px; }

  /* Wait time banner */
  .wait-banner { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 16px; display: none; }
  .wait-banner-top { font-size: 13px; color: #1d4ed8; font-weight: 500; }
  .wait-banner-time { font-size: 22px; font-weight: 700; color: #1d4ed8; margin: 2px 0; }
  .wait-banner-sub { font-size: 12px; color: #3b82f6; }

  .scheduled-fields { display: none; }

  .btn-submit { width: 100%; padding: 11px; background: var(--text); color: white; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: opacity 0.15s; }
  .btn-submit:hover { opacity: 0.85; } .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .toast { padding: 10px 14px; border-radius: var(--radius-sm); font-size: 13px; margin-bottom: 16px; display: none; }
  .toast.success { background: #f0faf4; border: 1px solid #a8dfc0; color: #1a6640; }
  .toast.error { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .stat-num { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .stat-label { font-size: 11px; color: var(--text-muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }

  /* Queue */
  .queue-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .queue-toolbar h2 { font-size: 15px; font-weight: 600; }
  .btn-ghost { padding: 7px 14px; font-size: 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); cursor: pointer; color: var(--text-muted); transition: color 0.15s, border-color 0.15s; }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }
  .section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); margin: 20px 0 8px; }

  .entry { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 8px; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .entry.status-progress { border-left: 3px solid #3b82f6; }
  .entry.status-done { opacity: 0.5; }
  .entry.type-scheduled { border-left: 3px solid #8b5cf6; }
  .entry.type-scheduled.status-progress { border-left: 3px solid #3b82f6; }
  .entry-stock { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 5px; }
  .entry-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 3px; }
  .dest-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
  .dest-offsite   { background: #e1f5ee; color: #085041; }
  .dest-testdrive { background: #e6f1fb; color: #0c447c; }
  .dest-wholesale { background: #faeeda; color: #633806; }
  .dest-detail    { background: #eeedfe; color: #3c3489; }
  .dest-service   { background: #fcebeb; color: #791f1f; }
  .status-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
  .status-pill.pending  { background: #fef9ec; color: #7c5a0a; }
  .status-pill.progress { background: #eff6ff; color: #1d4ed8; }
  .status-pill.done     { background: #f0faf4; color: #1a6640; }
  .type-pill-scheduled { background: #f3f0ff; color: #5b21b6; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
  .type-pill-asap { background: #fff7ed; color: #9a3412; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.04em; }
  .entry-meta { font-size: 13px; color: var(--text-muted); }
  .entry-notes { font-size: 13px; color: var(--text-muted); margin-top: 3px; font-style: italic; }
  .entry-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  .btn-action { padding: 5px 12px; font-size: 12px; font-weight: 500; border-radius: var(--radius-sm); cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); white-space: nowrap; transition: background 0.1s; }
  .btn-action:hover { background: #ebebea; }
  .btn-action.complete { border-color: #a8dfc0; background: #f0faf4; color: #1a6640; }
  .btn-action.complete:hover { background: #ddf5ea; }
  .entry-time { font-size: 11px; color: var(--text-faint); text-align: right; }
  .empty-state { text-align: center; padding: 40px 24px; color: var(--text-muted); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); }
  .empty-icon { font-size: 32px; margin-bottom: 10px; }
  .empty-state p { font-size: 14px; }

  /* TV */
  .tv-panel { background: #0f1117; min-height: calc(100vh - 105px); border-radius: var(--radius); padding: 28px; color: white; }
  .tv-header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .tv-title { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .tv-clock { font-size: 20px; font-weight: 300; opacity: 0.45; font-variant-numeric: tabular-nums; }
  .tv-sub { font-size: 12px; opacity: 0.35; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.08em; }
  .tv-section-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.35; margin: 20px 0 10px; }
  .tv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .tv-card { background: #1c1f2a; border: 1px solid #2e3140; border-radius: var(--radius); padding: 16px 18px; }
  .tv-card.in-progress { border-left: 3px solid #3b82f6; }
  .tv-card.type-scheduled { border-left: 3px solid #8b5cf6; }
  .tv-card.type-scheduled.in-progress { border-left: 3px solid #3b82f6; }
  .tv-stock { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 6px; }
  .tv-dest { margin-bottom: 10px; }
  .tv-scheduled-time { font-size: 13px; color: #a78bfa; font-weight: 600; margin-bottom: 6px; }
  .tv-wait { font-size: 13px; color: #fb923c; font-weight: 600; margin-bottom: 6px; }
  .tv-by { font-size: 12px; opacity: 0.4; }
  .tv-notes { font-size: 11px; opacity: 0.3; margin-top: 3px; font-style: italic; }
  .tv-ago { font-size: 11px; opacity: 0.25; margin-top: 6px; }
  .tv-empty { text-align: center; padding: 60px 24px; opacity: 0.25; }
  .tv-empty p { font-size: 16px; margin-top: 10px; }

  @media (max-width: 640px) {
    .main { padding: 16px; } .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .stat { padding: 12px; } .stat-num { font-size: 22px; }
    .entry { flex-direction: column; } .entry-actions { flex-direction: row; align-self: flex-start; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-brand">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><path d="M5 11l1.5-4.5h11L19 11M19 11v5H5v-5M5 11H3v2h2M19 11h2v2h-2M7.5 16v1.5M16.5 16v1.5M7 13.5h2M15 13.5h2"/></svg>
    </div>
    Lot Transfer Queue
  </div>
  <div class="header-right">
    <div class="sync-dot" id="sync-dot" title="Connecting…"></div>
    <div class="header-time" id="header-time"></div>
  </div>
</header>

<nav class="tabs">
  <button class="tab active" onclick="switchTab('form',this)">New request</button>
  <button class="tab" onclick="switchTab('queue',this)">Queue <span class="tab-count" id="tc-queue">0</span></button>
  <button class="tab" onclick="switchTab('tv',this)">TV display <span class="tab-count" id="tc-tv">0</span></button>
</nav>

<main class="main">

  <!-- NEW REQUEST -->
  <div id="panel-form" class="panel active">
    <div class="form-wrap">
      <div class="form-card">
        <div class="form-title">Request a vehicle move</div>
        <div class="form-subtitle">ASAP requests are queued immediately. Scheduled requests are added at the requested time.</div>
        <div id="form-toast" class="toast"></div>

        <div class="booking-toggle">
          <button class="toggle-btn active" id="btn-asap" onclick="setBookingType('asap')">
            <span class="toggle-btn-label">ASAP</span>
            <span class="toggle-btn-sub">Next available</span>
          </button>
          <button class="toggle-btn" id="btn-scheduled" onclick="setBookingType('scheduled')">
            <span class="toggle-btn-label">Schedule</span>
            <span class="toggle-btn-sub">Pick a time</span>
          </button>
        </div>

        <div id="wait-banner" class="wait-banner">
          <div class="wait-banner-top">Estimated wait time</div>
          <div class="wait-banner-time" id="wait-time-display">~15 min</div>
          <div class="wait-banner-sub" id="wait-time-sub">1 vehicle ahead in queue</div>
        </div>

        <div id="scheduled-fields" class="scheduled-fields">
          <div class="form-row">
            <label>Requested time <span style="color:#e24b4a">*</span></label>
            <input type="time" id="f-time" min="08:00" max="18:00" />
          </div>
        </div>

        <div class="form-row">
          <label>Stock # / VIN <span style="color:#e24b4a">*</span></label>
          <input id="f-stock" type="text" placeholder="e.g. 12345 or last 6 of VIN" autocomplete="off" />
        </div>
        <div class="form-row">
          <label>Destination <span style="color:#e24b4a">*</span></label>
          <select id="f-dest">
            <option value="">Select destination…</option>
            <option value="Offsite Lot">Offsite lot</option>
            <option value="Test Drive">Test drive</option>
            <option value="Service Bay">Service bay</option>
            <option value="Detail Shop">Detail shop</option>
            <option value="Wholesale / Auction">Wholesale / auction</option>
          </select>
        </div>
        <div class="form-row">
          <label>Requested by <span style="color:#e24b4a">*</span></label>
          <input id="f-by" type="text" placeholder="Your name or department" autocomplete="off" />
        </div>
        <div class="form-row">
          <label>Notes <span style="color:var(--text-faint);font-weight:400;text-transform:none;letter-spacing:0">optional</span></label>
          <textarea id="f-notes" placeholder="Special instructions, key location…"></textarea>
        </div>
        <button class="btn-submit" id="btn-submit" onclick="submitRequest()">Submit request</button>
      </div>
    </div>
  </div>

  <!-- QUEUE -->
  <div id="panel-queue" class="panel">
    <div class="stats">
      <div class="stat"><div class="stat-num" id="s-pending">0</div><div class="stat-label">Pending</div></div>
      <div class="stat"><div class="stat-num" id="s-progress">0</div><div class="stat-label">In progress</div></div>
      <div class="stat"><div class="stat-num" id="s-scheduled">0</div><div class="stat-label">Scheduled</div></div>
      <div class="stat"><div class="stat-num" id="s-done">0</div><div class="stat-label">Done today</div></div>
    </div>
    <div class="queue-toolbar">
      <h2>All requests</h2>
      <button class="btn-ghost" onclick="clearCompleted()">Clear completed</button>
    </div>
    <div id="queue-list"><div style="padding:24px;text-align:center;color:var(--text-muted)">Connecting…</div></div>
  </div>

  <!-- TV -->
  <div id="panel-tv" class="panel">
    <div class="tv-panel">
      <div class="tv-header">
        <div class="tv-title">Lot transfer queue</div>
        <div class="tv-clock" id="tv-clock"></div>
      </div>
      <div class="tv-sub" id="tv-count">Connecting…</div>
      <div id="tv-list"></div>
    </div>
  </div>

</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, push, onValue, update, remove } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyDYj9RC-cmfcfZ6sPo_9TmF67mWeEkxkwo",
  authDomain: "lot-queue.firebaseapp.com",
  databaseURL: "https://lot-queue-default-rtdb.firebaseio.com",
  projectId: "lot-queue",
  storageBucket: "lot-queue.firebasestorage.app",
  messagingSenderId: "729445608944",
  appId: "1:729445608944:web:7bfe67714631e279b54135"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const entriesRef = ref(db, 'entries');

const MOVE_MINS = 15;
const LOT_OPEN  = 8;
const LOT_CLOSE = 18;

let entries = {};
let bookingType = 'asap';

const syncDot = document.getElementById('sync-dot');

onValue(entriesRef, (snap) => {
  entries = snap.val() || {};
  syncDot.className = 'sync-dot live';
  syncDot.title = 'Live — syncing across all devices';
  render();
  updateWaitBanner();
}, () => { syncDot.className = 'sync-dot error'; });

function allSorted() {
  return Object.entries(entries)
    .map(([id, e]) => ({ id, ...e }))
    .sort((a, b) => {
      const aTime = a.bookingType === 'scheduled' ? a.scheduledTs : a.ts;
      const bTime = b.bookingType === 'scheduled' ? b.scheduledTs : b.ts;
      return aTime - bTime;
    });
}

function activeQueue() {
  const now = Date.now();
  return allSorted().filter(e => {
    if (e.status === 'done') return false;
    if (e.bookingType === 'scheduled' && e.scheduledTs > now) return false;
    return true;
  });
}

function upcomingScheduled() {
  const now = Date.now();
  return allSorted().filter(e => e.bookingType === 'scheduled' && e.scheduledTs > now && e.status !== 'done');
}

function calcWaitMins() {
  const q = activeQueue();
  const inProgress = q.filter(e => e.status === 'progress').length;
  const pending = q.filter(e => e.status === 'pending').length;
  return (inProgress + pending) * MOVE_MINS;
}

function estimatedReadyTime(extraMins) {
  const now = new Date();
  now.setMinutes(now.getMinutes() + extraMins);
  return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

window.setBookingType = function(type) {
  bookingType = type;
  document.getElementById('btn-asap').classList.toggle('active', type === 'asap');
  document.getElementById('btn-scheduled').classList.toggle('active', type === 'scheduled');
  document.getElementById('scheduled-fields').style.display = type === 'scheduled' ? 'block' : 'none';
  document.getElementById('wait-banner').style.display = type === 'asap' ? 'block' : 'none';
  if (type === 'asap') updateWaitBanner();
};

function updateWaitBanner() {
  if (bookingType !== 'asap') return;
  const wait = calcWaitMins();
  const banner = document.getElementById('wait-banner');
  const timeEl = document.getElementById('wait-time-display');
  const subEl  = document.getElementById('wait-time-sub');
  banner.style.display = 'block';
  if (wait === 0) {
    timeEl.textContent = 'Ready now';
    subEl.textContent  = 'No vehicles ahead in queue';
  } else {
    timeEl.textContent = '~' + wait + ' min';
    const q = activeQueue().filter(e => e.status !== 'done');
    subEl.textContent = q.length + ' vehicle' + (q.length !== 1 ? 's' : '') + ' ahead — ready around ' + estimatedReadyTime(wait);
  }
}

function showToast(msg, type) {
  const t = document.getElementById('form-toast');
  t.textContent = msg; t.className = 'toast ' + type; t.style.display = 'block';
  setTimeout(() => { t.style.display = 'none'; }, 4500);
}

window.submitRequest = async function() {
  const stock = document.getElementById('f-stock').value.trim();
  const dest  = document.getElementById('f-dest').value;
  const by    = document.getElementById('f-by').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const timeVal = document.getElementById('f-time').value;

  if (!stock || !dest || !by) { showToast('Please fill in Stock #, Destination, and Requested by.', 'error'); return; }
  if (bookingType === 'scheduled' && !timeVal) { showToast('Please select a requested time.', 'error'); return; }

  let scheduledTs = null;
  if (bookingType === 'scheduled') {
    const [h, m] = timeVal.split(':').map(Number);
    if (h < LOT_OPEN || h >= LOT_CLOSE) { showToast('Please choose a time between 8:00 AM and 6:00 PM.', 'error'); return; }
    const d = new Date(); d.setHours(h, m, 0, 0);
    if (d.getTime() < Date.now()) { showToast('Scheduled time is in the past — please pick a future time.', 'error'); return; }
    scheduledTs = d.getTime();
  }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = 'Submitting…';

  try {
    await push(entriesRef, {
      stock: stock.toUpperCase(), dest, by, notes,
      status: 'pending',
      bookingType,
      scheduledTs,
      ts: Date.now()
    });
    document.getElementById('f-stock').value = '';
    document.getElementById('f-dest').value = '';
    document.getElementById('f-by').value = '';
    document.getElementById('f-notes').value = '';
    document.getElementById('f-time').value = '';
    document.getElementById('f-stock').focus();
    const msg = bookingType === 'scheduled'
      ? '✓ ' + stock.toUpperCase() + ' scheduled for ' + document.getElementById('f-time').value
      : '✓ ' + stock.toUpperCase() + ' → ' + dest + ' added to queue';
    showToast(msg, 'success');
  } catch(e) {
    showToast('Error submitting — check your connection.', 'error');
  }
  btn.disabled = false; btn.textContent = 'Submit request';
};

window.setStatus = async (id, status) => { await update(ref(db, 'entries/' + id), { status }); };
window.deleteEntry = async (id) => { await remove(ref(db, 'entries/' + id)); };
window.clearCompleted = async () => {
  const promises = Object.entries(entries).filter(([,e]) => e.status === 'done').map(([id]) => remove(ref(db, 'entries/' + id)));
  await Promise.all(promises);
};

function destClass(d) {
  const map = { 'Offsite Lot':'dest-offsite','Test Drive':'dest-testdrive','Wholesale / Auction':'dest-wholesale','Detail Shop':'dest-detail','Service Bay':'dest-service' };
  return map[d] || 'dest-offsite';
}

function timeAgo(ts) {
  const diff = Math.floor((Date.now() - ts) / 60000);
  if (diff < 1) return 'Just now';
  if (diff === 1) return '1 min ago';
  if (diff < 60) return diff + ' mins ago';
  const h = Math.floor(diff / 60);
  return h + (h === 1 ? ' hr ago' : ' hrs ago');
}

function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function entryHTML(e) {
  const dc = destClass(e.dest);
  const sc = e.status === 'pending' ? 'pending' : e.status === 'progress' ? 'progress' : 'done';
  const sl = e.status === 'pending' ? 'Pending' : e.status === 'progress' ? 'In progress' : 'Done';
  const typePill = e.bookingType === 'scheduled'
    ? `<span class="type-pill-scheduled">Scheduled ${fmtTime(e.scheduledTs)}</span>`
    : `<span class="type-pill-asap">ASAP</span>`;
  let actions = '';
  if (e.status === 'pending') {
    actions = `<button class="btn-action" onclick="setStatus('${e.id}','progress')">Start move</button>
               <button class="btn-action complete" onclick="setStatus('${e.id}','done')">Complete</button>`;
  } else if (e.status === 'progress') {
    actions = `<button class="btn-action complete" onclick="setStatus('${e.id}','done')">Complete</button>`;
  } else {
    actions = `<button class="btn-action" onclick="deleteEntry('${e.id}')">Remove</button>`;
  }
  const typeClass = e.bookingType === 'scheduled' ? ' type-scheduled' : '';
  return `<div class="entry status-${e.status}${typeClass}">
    <div>
      <div class="entry-stock">${e.stock}</div>
      <div class="entry-row"><span class="dest-pill ${dc}">${e.dest}</span><span class="status-pill ${sc}">${sl}</span>${typePill}</div>
      <div class="entry-meta">By: ${e.by}</div>
      ${e.notes ? `<div class="entry-notes">${e.notes}</div>` : ''}
    </div>
    <div class="entry-actions">${actions}<div class="entry-time">${timeAgo(e.ts)}</div></div>
  </div>`;
}

function render() {
  const all       = allSorted();
  const active    = activeQueue();
  const upcoming  = upcomingScheduled();
  const done      = all.filter(e => e.status === 'done');
  const pending   = active.filter(e => e.status === 'pending').length;
  const progress  = active.filter(e => e.status === 'progress').length;

  document.getElementById('s-pending').textContent   = pending;
  document.getElementById('s-progress').textContent  = progress;
  document.getElementById('s-scheduled').textContent = upcoming.length;
  document.getElementById('s-done').textContent      = done.length;
  document.getElementById('tc-queue').textContent    = pending + progress + upcoming.length;
  document.getElementById('tc-tv').textContent       = active.length + upcoming.length;

  // Queue list
  const list = document.getElementById('queue-list');
  if (!all.length) {
    list.innerHTML = '<div class="empty-state"><div class="empty-icon">🚗</div><p>No requests yet.</p></div>';
  } else {
    let html = '';
    if (active.length) {
      html += '<div class="section-label">Active queue</div>';
      html += active.map(entryHTML).join('');
    }
    if (upcoming.length) {
      html += '<div class="section-label">Upcoming scheduled</div>';
      html += upcoming.map(entryHTML).join('');
    }
    if (done.length) {
      html += '<div class="section-label">Completed</div>';
      html += done.map(entryHTML).join('');
    }
    list.innerHTML = html;
  }

  // TV
  const tvList  = document.getElementById('tv-list');
  const tvCount = document.getElementById('tv-count');
  const totalActive = active.length + upcoming.length;

  if (!totalActive) {
    tvCount.textContent = 'No active moves';
    tvList.innerHTML = '<div class="tv-empty"><div style="font-size:40px">✓</div><p>All clear — no pending moves</p></div>';
  } else {
    tvCount.textContent = totalActive + ' active ' + (totalActive === 1 ? 'move' : 'moves');
    let tvHtml = '';
    if (active.length) {
      tvHtml += '<div class="tv-section-label">Now</div><div class="tv-grid">';
      tvHtml += active.map(e => {
        const dc = destClass(e.dest);
        const prog = e.status === 'progress' ? ' in-progress' : '';
        const wait = calcWaitMins();
        const waitStr = wait > 0 ? '~' + wait + ' min wait' : 'Ready now';
        return `<div class="tv-card${prog}">
          <div class="tv-stock">${e.stock}</div>
          <div class="tv-dest"><span class="dest-pill ${dc}">${e.dest}</span></div>
          ${e.bookingType === 'asap' ? `<div class="tv-wait">${waitStr}</div>` : ''}
          <div class="tv-by">By: ${e.by}</div>
          ${e.notes ? `<div class="tv-notes">${e.notes}</div>` : ''}
          <div class="tv-ago">${timeAgo(e.ts)}</div>
        </div>`;
      }).join('');
      tvHtml += '</div>';
    }
    if (upcoming.length) {
      tvHtml += '<div class="tv-section-label">Upcoming</div><div class="tv-grid">';
      tvHtml += upcoming.map(e => {
        const dc = destClass(e.dest);
        return `<div class="tv-card type-scheduled">
          <div class="tv-stock">${e.stock}</div>
          <div class="tv-dest"><span class="dest-pill ${dc}">${e.dest}</span></div>
          <div class="tv-scheduled-time">Scheduled ${fmtTime(e.scheduledTs)}</div>
          <div class="tv-by">By: ${e.by}</div>
          ${e.notes ? `<div class="tv-notes">${e.notes}</div>` : ''}
        </div>`;
      }).join('');
      tvHtml += '</div>';
    }
    tvList.innerHTML = tvHtml;
  }

  updateWaitBanner();
}

window.switchTab = function(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
};

function updateClock() {
  const now = new Date();
  const t = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const d = now.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric' });
  const h = document.getElementById('header-time');
  const tv = document.getElementById('tv-clock');
  if (h) h.textContent = d + ' · ' + t;
  if (tv) tv.textContent = t;
}

updateClock();
setInterval(updateClock, 10000);
setInterval(render, 30000);

// Set default time to next 15-min slot
const now = new Date();
now.setMinutes(Math.ceil(now.getMinutes() / 15) * 15, 0, 0);
const hh = String(now.getHours()).padStart(2, '0');
const mm = String(now.getMinutes()).padStart(2, '0');
document.getElementById('f-time').value = hh + ':' + mm;
</script>
</body>
